services:
  db:
    image: postgres:16-alpine
    container_name: groundwork-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-groundwork}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-groundwork}
      POSTGRES_DB: ${POSTGRES_DB:-groundwork}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-groundwork} -d ${POSTGRES_DB:-groundwork}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: groundwork-api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-groundwork}:${POSTGRES_PASSWORD:-groundwork}@db:5432/${POSTGRES_DB:-groundwork}
      PORT: 4000
    command: sh -c "pnpm db:migrate && pnpm db:seed && pnpm --filter @groundwork/api start"
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:alpine
    container_name: groundwork-web
    restart: unless-stopped
    depends_on:
      - api
    volumes:
      - ./apps/web/dist:/usr/share/nginx/html:ro
      - ./nginx/web.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"

  admin:
    image: nginx:alpine
    container_name: groundwork-admin
    restart: unless-stopped
    depends_on:
      - api
    volumes:
      - ./apps/admin/dist:/usr/share/nginx/html:ro
      - ./nginx/admin.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8081:80"

volumes:
  db_data:
