[package]
name = "cribstone-admin"
version = "0.1.0"
description = "Cribstone Coffee admin dashboard desktop app"
authors = ["Cribstone Coffee"]
edition = "2021"

[lib]
name = "cribstone_admin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
